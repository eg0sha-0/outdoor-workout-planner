services:
  db:
    image: postgres:18
    environment:
      POSTGRES_PASSWORD: planner
      POSTGRES_DB: planner
    volumes:
      - data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d planner"]
      interval: 3s
      timeout: 3s
      retries: 20
  web:
    build: .
    environment:
      DATABASE_URL: postgresql://postgres:planner@db/planner
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      db:
        condition: service_healthy
volumes:
  data:
